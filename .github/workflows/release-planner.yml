# release-planner:generated v0.5.0 sha256:6d5158b10d922902. Do not edit; change .release-planner/config.yml and run release-planner install.
name: Release
# A pull request that adds or edits release notes is validated, checked, and built before it
# merges, and blocks at the start and end of its description report the release's status. Merging it
# into main approves publication, so ordinary changes never create releases.
on:
  push:
    branches: ['main']
    paths: ['_releases/v*.md']
  pull_request:
    paths: ['_releases/**', '.release-planner/**', '.github/workflows/release-planner.yml', '.github/workflows/release-checks.yml', '.github/workflows/build-release.yml']
  # Retry a failed publication by naming the commit the release pull request merged as.
  workflow_dispatch:
    inputs:
      merged-commit:
        description: 'Full SHA of the commit the release pull request merged as on main'
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_PLANNER_VERSION: v0.5.0
jobs:
  # Check the generated files, then validate the release pull request and bind it to one
  # release commit: the newest commit the pull request shares with main. Release notes
  # rules that the notes break are warnings, not failures. After the merge, it also finds the
  # pull request's run, whose checks and assets the release reuses.
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to check the environments' settings and find the pull request's run
      pull-requests: read # to find the merged pull request
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      publish: ${{ steps.validate.outputs.publish }}
      build: ${{ steps.validate.outputs.build }}
      build-run: ${{ steps.validate.outputs.build-run }}
      # The artifacts publish uses, by ID: this run's plan, and the pull request run's plan and
      # assets when this run reuses them. Downloading by name would take any job's upload.
      plan-artifact: ${{ steps.upload-plan.outputs.artifact-id }}
      built-plan-artifact: ${{ steps.validate.outputs.built-plan-artifact }}
      built-assets-artifact: ${{ steps.validate.outputs.built-assets-artifact }}
      # Why a run after the merge stopped on purpose, set even though validate fails, for the
      # report: a later commit withdrew or replaced the request, or an earlier release must
      # publish first.
      withdrawn: ${{ steps.validate.outputs.withdrawn }}
      waiting-for: ${{ steps.validate.outputs.waiting-for }}
      waiting-for-file: ${{ steps.validate.outputs.waiting-for-file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Version ordering and the release commit need the full history and tags.
          fetch-depth: 0
          # A manual retry checks out the workflow's own commit, not the merged one, so check compares
          # the generated files with the Release Planner version that runs, even after an upgrade;
          # validate reads the merged commit from the history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Release Planner v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        # Verify the build attestation of the checksum manifest, then the archive against it.
        run: |
          dir="$RUNNER_TEMP/release-planner"
          mkdir -p "$dir" && cd "$dir"
          archive="release-planner_${RELEASE_PLANNER_VERSION#v}_linux_amd64.tar.gz"
          gh release download "$RELEASE_PLANNER_VERSION" --repo fabricahq/release-planner --pattern SHA256SUMS --pattern "$archive"
          gh attestation verify SHA256SUMS --repo fabricahq/release-planner
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "$archive" release-planner
          echo "$dir" >> "$GITHUB_PATH"
      - name: Check the generated release files
        run: release-planner check
      - name: Validate the release pull request
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MERGED: ${{ inputs.merged-commit || github.sha }}
        run: |
          if [ -n "$HEAD" ]; then
            release-planner validate --ci --base "$BASE" --head "$HEAD" --head-repository "$HEAD_REPOSITORY" --out "$RUNNER_TEMP/release-plan.json"
          else
            release-planner validate --ci --merged "$MERGED" --out "$RUNNER_TEMP/release-plan.json"
          fi
      - id: upload-plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error

  # Run this repository's release-only checks on the release commit: on the pull request, or
  # after the merge if the pull request's run can't be reused. The called workflow gets the
  # repository's secrets, but never the release-write token.
  release-checks:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    uses: ./.github/workflows/release-checks.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}
    secrets: inherit

  # Build the release assets from the release commit, with read-only access and no secrets.
  # The called workflow uploads them as one artifact named release-assets, and outputs its ID.
  release-assets:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}

  # Attest each asset's build provenance, so publish can check the files came from this
  # workflow, and record which plan and assets artifacts the release uses, in the name of a
  # release-binding artifact, so the merge can reuse exactly those. It waits for every job that
  # runs repository code, so nothing can add a second binding after it. This job runs no
  # repository code.
  attest:
    needs: [validate, release-assets, release-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      assets-artifact: ${{ needs.release-assets.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release-assets.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/release-assets/*'
      - name: Record the artifacts the release uses
        env:
          PLAN: ${{ needs.validate.outputs.plan-artifact }}
          ASSETS: ${{ needs.release-assets.outputs.artifact-id }}
        run: printf 'plan=%s\nassets=%s\n' "$PLAN" "$ASSETS" > "$RUNNER_TEMP/release-binding"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binding-${{ needs.validate.outputs.plan-artifact }}-${{ needs.release-assets.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-binding
          overwrite: false
          if-no-files-found: error

  # The only job that can write, and only after the merge. It runs the pinned Release Planner
  # version and no repository code. It tags the release commit and publishes the approved
  # notes, or replaces the notes of published releases.
  # It verifies each asset's attestation, stages the assets on a draft, and publishes last.
  publish:
    needs: [validate, release-checks, release-assets, attest]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.validate.outputs.publish == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read # to confirm the merged pull request
      actions: read # to download the pull request's run's artifacts
      attestations: read # to verify the assets' build attestations
    # What publish did, for the report.
    outputs:
      release: ${{ steps.publish.outputs.release }}
      notes: ${{ steps.publish.outputs.notes }}
    # Serialize publication so competing releases cannot race. Waiting runs queue in order;
    # without a queue, a newer waiting run would cancel an older one.
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    steps:
      # An optional release GitHub App publishes instead of the workflow's token, so a tag
      # ruleset can let only it create release tags, and it can tag a commit that changes
      # workflow files, which the workflow's token can't.
      - name: Check the release GitHub App settings
        id: app
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] && [ "$HAS_KEY" != true ]; then
            echo "use=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release App::Set both RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY in the release environment, or neither: https://release-planner.fabricahq.com/start-here/set-up/#publish-with-a-release-github-app"
            exit 1
          fi
          echo "use=true" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        if: steps.app.outputs.use == 'true'
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      # The release branch's history, to check that no later commit withdrew or replaced the
      # notes the merge approved. Nothing from it runs.
      - name: Check out the release branch's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Release Planner v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        # Verify the build attestation of the checksum manifest, then the archive against it.
        run: |
          dir="$RUNNER_TEMP/release-planner"
          mkdir -p "$dir" && cd "$dir"
          archive="release-planner_${RELEASE_PLANNER_VERSION#v}_linux_amd64.tar.gz"
          gh release download "$RELEASE_PLANNER_VERSION" --repo fabricahq/release-planner --pattern SHA256SUMS --pattern "$archive"
          gh attestation verify SHA256SUMS --repo fabricahq/release-planner
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "$archive" release-planner
          echo "$dir" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.plan-artifact }}
          path: ${{ runner.temp }}/plan
      # The run that checked and built the release: the pull request's, or this one.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.tag != ''
        with:
          artifact-ids: ${{ needs.validate.outputs.built-plan-artifact || needs.validate.outputs.plan-artifact }}
          path: ${{ runner.temp }}/built
          run-id: ${{ needs.validate.outputs.build-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.tag != ''
        with:
          artifact-ids: ${{ needs.validate.outputs.built-assets-artifact || needs.attest.outputs.assets-artifact }}
          path: ${{ runner.temp }}/release-assets
          run-id: ${{ needs.validate.outputs.build-run }}
          github-token: ${{ github.token }}
      - name: Publish the approved release
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Empty without the release App, so writes use GITHUB_TOKEN.
          RELEASE_TOKEN: ${{ steps.token.outputs.token }}
        run: release-planner publish --plan "$RUNNER_TEMP/plan/release-plan.json" --built-plan "$RUNNER_TEMP/built/release-plan.json" --branch main --assets "$RUNNER_TEMP/release-assets" --signer-workflow .github/workflows/release-planner.yml

  # Attest the published assets again, from the release branch. The attest job ran on the
  # pull request; this attestation exists only for files that were approved, verified, and
  # published, so post-publish workflows and other consumers can require one signed on main. This job runs no
  # repository code.
  attest-release:
    needs: [validate, publish]
    # !cancelled() stops GitHub from adding success(), which would skip this job whenever the
    # build was reused and its jobs skipped.
    if: "!cancelled() && needs.publish.result == 'success' && needs.validate.outputs.tag != ''"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/published/*'

  # Keep the summary at the start of the release pull request's description and the status at
  # its end up to date, from its checks through publication, whatever failed. After the merge, a
  # failure also gets a comment that mentions whoever merged, since editing a description
  # notifies no one.
  report:
    needs: [validate, release-checks, release-assets, attest, publish, attest-release]
    if: always() && needs.validate.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to download and link the build run's assets and link each job
      pull-requests: write # to edit the description's release status and comment on a failure
    steps:
      - name: Install Release Planner v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        # Verify the build attestation of the checksum manifest, then the archive against it.
        run: |
          dir="$RUNNER_TEMP/release-planner"
          mkdir -p "$dir" && cd "$dir"
          archive="release-planner_${RELEASE_PLANNER_VERSION#v}_linux_amd64.tar.gz"
          gh release download "$RELEASE_PLANNER_VERSION" --repo fabricahq/release-planner --pattern SHA256SUMS --pattern "$archive"
          gh attestation verify SHA256SUMS --repo fabricahq/release-planner
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "$archive" release-planner
          echo "$dir" >> "$GITHUB_PATH"
      # Missing when validation failed; the report says which job did.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.plan-artifact != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.validate.outputs.plan-artifact }}
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.built-assets-artifact != '' || needs.attest.outputs.assets-artifact != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.validate.outputs.built-assets-artifact || needs.attest.outputs.assets-artifact }}
          path: ${{ runner.temp }}/release-assets
          run-id: ${{ needs.validate.outputs.build-run }}
          github-token: ${{ github.token }}
      - name: Report the release status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MERGED: ${{ inputs.merged-commit || github.sha }}
        run: |
          if [ -n "$PULL_REQUEST" ]; then target=(--pull-request "$PULL_REQUEST" --head-sha "$HEAD_SHA" --head-ref "$HEAD_REF" --head-repository "$HEAD_REPOSITORY"); else target=(--merged "$MERGED"); fi
          release-planner report --needs "$NEEDS" --branch main --plan "$RUNNER_TEMP/plan/release-plan.json" --assets "$RUNNER_TEMP/release-assets" "${target[@]}"
