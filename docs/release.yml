# Copy this file to .github/workflows/release.yml in a consuming repository.
# Replace RELEASE_PLANNER_SHA with a full commit SHA from fabricahq/release-planner,
# and replace the validate job's steps with your repository's own checks or builds.
name: Release
# Validate notes while they are in a PR. A notes change on main approves publication,
# so ordinary changes do not create releases automatically.
on:
  push:
    branches: [main]
    paths: ['releases/v*.md']
  pull_request:
    paths: ['releases/**']
  # Retry a failed publication with both endpoints of the original approved push.
  workflow_dispatch:
    inputs:
      commit:
        description: 'Approved head SHA from the original failed run summary'
        required: true
        type: string
      base:
        description: 'Base SHA from the original failed run summary (before the approved push)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Version ordering and retry validation require the full history and tags.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: plan
        uses: fabricahq/release-planner/plan@RELEASE_PLANNER_SHA
        with:
          base: ${{ inputs.base }}
          head: ${{ inputs.commit }}
          # The version your first release must use.
          first-version: v0.1.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan
          path: ${{ steps.plan.outputs.plan-file }}
          if-no-files-found: error

  # Check the exact approved commit. Replace these steps with your tests or builds.
  validate:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: echo "Run your repository's checks here"

  # Only this job can write. It checks out no source.
  publish:
    needs: [plan, validate]
    if: needs.plan.outputs.tag != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan
      - uses: fabricahq/release-planner/publish@RELEASE_PLANNER_SHA
        with:
          plan-file: ${{ runner.temp }}/plan/release-plan.json
