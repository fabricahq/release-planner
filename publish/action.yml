name: Publish release
description: Tag the approved commit and publish the approved notes verbatim as a GitHub release.
inputs:
  plan-file:
    description: Plan JSON produced by the plan action.
    required: true
  token:
    description: Token with contents write access to the repository.
    required: false
    default: ${{ github.token }}
  repository:
    description: Repository to publish in, as owner/name.
    required: false
    default: ${{ github.repository }}
outputs:
  url:
    description: URL of the published release.
    value: ${{ steps.publish.outputs.url }}
runs:
  using: composite
  steps:
    - id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ inputs.repository }}
        PLAN: ${{ inputs.plan-file }}
      run: |
        set -euo pipefail
        url=$(bash "$GITHUB_ACTION_PATH/../src/publish_release.sh" "$PLAN" | tail -n 1)
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Published $url" >> "$GITHUB_STEP_SUMMARY"
